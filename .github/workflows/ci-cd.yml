name: CI & Docker Hub Publish

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    name: Validate Portfolio Static Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Core Files
        run: |
          test -f index.html
          test -f Dockerfile
          test -f nginx.conf
          test -d css
          test -d js
          echo "✔ Core static files and modular assets validated successfully."

  build-and-push:
    name: Build & Push Docker Image to Docker Hub
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune Old Docker Hub Tags (Keep Latest + 3 Most Recent)
        if: success()
        run: |
          echo "Authenticating with Docker Hub API..."
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${{ secrets.DOCKERHUB_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "⚠ Could not obtain Docker Hub API token. Skipping tag pruning."
            exit 0
          fi

          REPO="${{ secrets.DOCKERHUB_USERNAME }}/portfolio"
          echo "Inspecting tags for $REPO..."
          TAGS_JSON=$(curl -s -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/$REPO/tags/?page_size=100")
          TAGS_TO_DELETE=$(echo "$TAGS_JSON" | jq -r '[.results[] | select(.name != "latest") | .name] | .[3:][] // empty')

          if [ -z "$TAGS_TO_DELETE" ]; then
            echo "✔ No excess tags to delete for $REPO."
          else
            for TAG in $TAGS_TO_DELETE; do
              echo "Deleting old tag: $TAG"
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/$REPO/tags/$TAG/")
              if [ "$HTTP_STATUS" = "204" ] || [ "$HTTP_STATUS" = "200" ]; then
                echo "✔ Successfully deleted $TAG"
              else
                echo "⚠ Could not delete $TAG (HTTP $HTTP_STATUS - ensure Docker Hub token has Delete permission)"
              fi
            done
          fi

      - name: Update Kubernetes Manifest Tag & Push to GitOps
        run: |
          sed -i "s|image: .*/portfolio:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ github.sha }}|g" k8s/portfolio.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/portfolio.yaml
          git diff --staged --quiet || (git commit -m "chore(gitops): update portfolio image tag to ${{ github.sha }} [skip ci]" && git push origin HEAD)
